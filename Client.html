<script>
  (function () {
    'use strict';

    const app = document.getElementById('app');
    const adminStorageKey = 'ficha8-admin-session';
    const state = {
      adminToken: '',
      adminSnapshot: null,
      adminTimer: null,
      adminOpenGroups: new Set(),
      linkResult: null,
      guideOpen: false,
      groupId: window.FICHA8_CONFIG.groupId || '',
      groupKey: window.FICHA8_CONFIG.groupKey || '',
      groupSnapshot: null,
      groupTimer: null,
      selectedId: '',
      dirty: false,
      saving: false,
      banner: '',
      bannerError: false
    };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
        return {
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[character];
      });
    }

    function runServer(method, args) {
      return new Promise(function (resolve, reject) {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (error) {
            reject(new Error(error && error.message ? error.message : 'No se pudo completar la solicitud.'));
          });
        runner[method].apply(runner, args || []);
      });
    }

    function renderLoading(message) {
      app.innerHTML = '<div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>' +
        escapeHtml(message || 'Preparando la mesa de trabajo…') + '</span></div>';
    }

    function renderError(title, message, retryMarkup) {
      app.innerHTML = '<section class="admin-login" aria-labelledby="error-title">' +
        '<h1 id="error-title">' + escapeHtml(title) + '</h1>' +
        '<p class="lead">' + escapeHtml(message) + '</p>' +
        (retryMarkup || '') + '</section>';
    }

    function bindGroupRetry() {
      const button = document.getElementById('retry-group');
      if (!button) return;
      button.addEventListener('click', function () {
        renderLoading('Actualizando la ficha…');
        refreshGroup(true).catch(function (error) {
          renderError('No se pudo actualizar esta ficha', error.message, '<button class="secondary-button" type="button" id="retry-group">Volver a intentar</button>');
          bindGroupRetry();
        });
      });
    }

    function announce(message) {
      document.getElementById('announcements').textContent = message;
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    const SEMAFORO_INFO = [
      { name: 'Mantener', cls: 'keep', fill: 'mantener-fill', desc: 'Conservar lo propuesto' },
      { name: 'Revisar', cls: 'review', fill: 'revisar-fill', desc: 'Precisar o resguardar' },
      { name: 'Modificar', cls: 'modify', fill: 'modificar-fill', desc: 'Corregir un problema o efecto no deseado' },
      { name: 'Incorporar', cls: 'add', fill: 'incorporar-fill', desc: 'Cubrir un aspecto ausente' }
    ];

    function semaforoClass(value) {
      return {
        'Mantener': 'mantener',
        'Revisar': 'revisar',
        'Modificar': 'modificar',
        'Incorporar': 'incorporar'
      }[value] || '';
    }

    function fileSize(bytes) {
      if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1).replace('.', ',') + ' MB';
    }

    function fileLinks(files) {
      if (!files.length) return '<span class="field-hint">Sin archivos adjuntos.</span>';
      return files.map(function (file) {
        return '<a class="file-chip" href="' + escapeAttribute(file.url) + '" target="_blank" rel="noopener noreferrer">' +
          '<span>' + escapeHtml(file.name) + '</span><span class="file-size">' + fileSize(Number(file.size || 0)) + '</span></a>';
      }).join('');
    }

    function bindAdminLogin() {
      const form = document.getElementById('admin-login-form');
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        const message = document.getElementById('login-error');
        button.disabled = true;
        button.textContent = 'Verificando…';
        message.hidden = true;
        try {
          const result = await runServer('unlockAdmin', [form.elements.code.value]);
          state.adminToken = result.token;
          sessionStorage.setItem(adminStorageKey, result.token);
          await refreshAdmin(true);
        } catch (error) {
          message.textContent = error.message;
          message.hidden = false;
          button.disabled = false;
          button.textContent = 'Entrar al panel';
        }
      });
    }

    function semaforoKey() {
      return '<ul class="semaforo-key">' + SEMAFORO_INFO.map(function (item) {
        return '<li><span class="dot ' + item.fill + '" aria-hidden="true"></span><span><strong>' + item.name + ':</strong> ' + item.desc.toLowerCase() + '.</span></li>';
      }).join('') + '</ul>';
    }

    function renderHome(message) {
      stopTimers();
      document.getElementById('admin-logout').hidden = true;
      app.innerHTML = '<div class="home">' +
        '<section class="home-hero" aria-labelledby="home-title">' +
          '<div class="home-intro"><h1 id="home-title">Revisión del Reglamento General Académico</h1>' +
          '<p class="lead">Una mesa de trabajo para discutir la propuesta en grupos y salir con un conjunto acotado de observaciones que el Departamento pueda defender y fundamentar.</p>' +
          '<p class="home-question">¿Qué modelo de carrera académica está construyendo este reglamento y cómo afecta nuestro trabajo cotidiano?</p></div>' +
          '<div class="home-entry">' +
            '<section class="home-path primary" aria-labelledby="path-facilita"><h2 id="path-facilita">Facilito la reunión</h2>' +
              '<p>Crea los grupos, comparte sus enlaces y sigue los aportes en vivo.</p>' +
              (message ? '<p class="notice" role="status">' + escapeHtml(message) + '</p>' : '') +
              '<button class="primary-button" type="button" id="go-admin">Entrar a la facilitación</button></section>' +
            '<section class="home-path" aria-labelledby="path-grupo"><h2 id="path-grupo">Integro un grupo</h2>' +
              '<p>Abre el enlace de tu grupo que compartió la persona facilitadora. Allí completan la Ficha 8 y adjuntan sus respaldos.</p></section>' +
          '</div>' +
        '</section>' +
        '<div class="home-details">' +
          '<section aria-labelledby="home-ritmo"><h2 id="home-ritmo">Cómo trabajaremos</h2>' +
            '<ol class="login-steps">' +
              '<li><span><strong>Semáforo del reglamento · 40 min</strong>Cada grupo clasifica los aspectos de sus ámbitos: mantener, revisar, modificar o incorporar.</span></li>' +
              '<li><span><strong>Problemas y tensiones · 30–50 min</strong>Registran qué plantea cada disposición, qué problema produce, qué principio está en juego y qué proponen.</span></li>' +
              '<li><span><strong>Nudos críticos · 20 min</strong>Cada grupo presenta sus tres observaciones prioritarias en la conversación final.</span></li>' +
            '</ol></section>' +
          '<section aria-labelledby="home-ficha"><h2 id="home-ficha">La Ficha 8</h2>' + semaforoKey() +
            '<p class="file-help">Cada observación registra: artículo, semáforo, qué plantea, problema/tensión, principio en juego y propuesta.</p></section>' +
        '</div></div>';
      document.getElementById('go-admin').addEventListener('click', function () { renderAdminLogin(''); });
    }

    function renderAdminLogin(errorMessage) {
      stopTimers();
      document.getElementById('admin-logout').hidden = true;
      app.innerHTML = '<div class="login-layout"><section class="admin-login" aria-labelledby="login-title">' +
        '<button class="text-button subtle back-button" type="button" id="back-home">← Volver al inicio</button>' +
        '<h1 id="login-title">Mesa de trabajo</h1>' +
        '<p class="lead">Acceso para la persona facilitadora. Desde aquí puedes crear grupos, seguir los aportes y cerrar o reabrir sus fichas.</p>' +
        '<form id="admin-login-form">' +
          '<div class="field"><label for="admin-code">Código de facilitación</label>' +
          '<input id="admin-code" name="code" type="password" autocomplete="current-password" required aria-describedby="login-hint"></div>' +
          '<p id="login-hint" class="login-note">El código se genera al configurar el proyecto de Apps Script. No lo compartas en los enlaces de grupo.</p>' +
          '<p id="login-error" class="error-notice" role="alert"' + (errorMessage ? '' : ' hidden') + '>' + escapeHtml(errorMessage || '') + '</p>' +
          '<button class="primary-button" type="submit">Entrar al panel</button>' +
        '</form></section>' +
        '<aside class="login-context" aria-labelledby="context-title"><h2 id="context-title">Cómo funciona la mesa</h2>' +
          '<ol class="login-steps">' +
            '<li><span><strong>Crea un grupo por mesa.</strong>Cada grupo recibe un enlace propio a su Ficha 8.</span></li>' +
            '<li><span><strong>Los grupos registran observaciones.</strong>Clasifican cada aspecto con el semáforo y pueden adjuntar respaldos.</span></li>' +
            '<li><span><strong>Sigue el avance en vivo.</strong>El panel se actualiza solo y permite cerrar las fichas al terminar.</span></li>' +
          '</ol>' +
        '</aside></div>';
      bindAdminLogin();
      document.getElementById('back-home').addEventListener('click', function () { renderHome(''); });
      document.getElementById('admin-code').focus();
    }

    function semaforoSummary(groups) {
      const counts = SEMAFORO_INFO.map(function (item) {
        let count = 0;
        groups.forEach(function (entry) {
          (entry.observations || []).forEach(function (observation) {
            if (observation.semaforo === item.name) count += 1;
          });
        });
        return { item: item, count: count };
      });
      const total = counts.reduce(function (sum, entry) { return sum + entry.count; }, 0);
      if (!total) return '';
      return '<section class="semaforo-summary" aria-label="Distribución del semáforo en todos los grupos">' +
        '<div class="semaforo-bar" aria-hidden="true">' + counts.filter(function (entry) { return entry.count; }).map(function (entry) {
          return '<span class="' + entry.item.fill + '" style="flex-grow:' + entry.count + '"></span>';
        }).join('') + '</div>' +
        '<ul class="semaforo-legend">' + counts.map(function (entry) {
          return '<li><span class="dot ' + entry.item.fill + '" aria-hidden="true"></span>' + entry.item.name + ' <strong>' + entry.count + '</strong></li>';
        }).join('') + '</ul></section>';
    }

    function groupBadge(name) {
      const value = String(name || '').trim();
      const number = value.match(/(\d+)\s*$/);
      if (number) return number[1].slice(-3);
      const words = value.split(/\s+/).filter(Boolean);
      return (words.slice(0, 2).map(function (word) { return word.charAt(0); }).join('') || '·').toUpperCase();
    }

    function renderAdmin(snapshot) {
      document.getElementById('admin-logout').hidden = false;
      const oldForm = document.getElementById('create-group-form');
      const activeElement = document.activeElement;
      const focusId = activeElement && app.contains(activeElement) ? activeElement.id : '';
      const selectionStart = activeElement && typeof activeElement.selectionStart === 'number' ? activeElement.selectionStart : null;
      const selectionEnd = activeElement && typeof activeElement.selectionEnd === 'number' ? activeElement.selectionEnd : null;
      const formDraft = oldForm ? {
        name: oldForm.elements.name.value,
        areas: oldForm.elements.areas.value
      } : null;
      state.adminSnapshot = snapshot;
      const groups = snapshot.groups || [];
      const openCount = groups.filter(function (entry) { return entry.summary.status === 'Abierto'; }).length;
      const totalObservations = groups.reduce(function (sum, entry) { return sum + entry.summary.observationCount; }, 0);
      const rows = groups.length ? groups.map(renderAdminGroup).join('') :
        '<div class="empty-state"><strong>Aún no hay grupos</strong>Créales una ficha para que puedan comenzar a registrar observaciones.</div>';

      app.innerHTML = '<div class="page-heading">' +
          '<div class="heading-row"><div><h1>Mesa de trabajo</h1>' +
          '<p class="lead">Sigue los aportes de los grupos sin convertir la reunión en una lectura artículo por artículo.</p></div>' +
          '<div class="heading-meta"><strong>' + openCount + '</strong> ' + (openCount === 1 ? 'grupo abierto' : 'grupos abiertos') +
          ' · <strong>' + totalObservations + '</strong> ' + (totalObservations === 1 ? 'observación' : 'observaciones') + '</div></div>' +
        '</div>' +
        semaforoSummary(groups) +
        (state.banner ? '<p class="' + (state.bannerError ? 'error-notice' : 'notice') + '" role="' + (state.bannerError ? 'alert' : 'status') + '">' + escapeHtml(state.banner) + '</p>' : '') +
        '<div id="created-link"></div>' +
        '<div class="dashboard-grid">' +
          '<section aria-labelledby="groups-title"><div class="section-head"><h2 id="groups-title">Grupos de trabajo</h2>' +
          '<span class="section-count">' + groups.length + (groups.length === 1 ? ' grupo' : ' grupos') + '</span></div>' +
          '<div class="group-list">' + rows + '</div></section>' +
          '<aside class="create-panel" aria-labelledby="create-title"><h2 id="create-title">Crear un grupo</h2>' +
          '<p>Se generará una ficha compartida y un enlace propio. Puedes asignar ahora los ámbitos de trabajo.</p>' +
          '<form id="create-group-form">' +
            '<div class="field"><label for="group-name">Nombre del grupo</label><input id="group-name" name="name" type="text" maxlength="100" placeholder="Ej. Grupo 1"></div>' +
            '<div class="field"><label for="group-areas">Ámbitos asignados</label><textarea id="group-areas" name="areas" maxlength="240" placeholder="Ej. Carrera académica y reconocimiento de gestión"></textarea>' +
            '<p class="field-hint">Opcional; se puede usar para anotar los títulos o temas que trabajará el grupo.</p></div>' +
            '<button class="primary-button" type="submit">Crear ficha de grupo</button>' +
          '</form>' +
            '<details class="facilitation-guide"><summary>Guía de facilitación</summary><div class="guide-body">' +
              '<h3>Abrir la conversación</h3><blockquote>“La idea de esta reunión no es revisar mecánicamente los 68 artículos. Preguntarse por qué modelo de carrera académica está construyendo este reglamento, cómo afecta nuestro trabajo cotidiano y qué aspectos necesitamos precisar o modificar. Trabajaremos desde cuatro posibilidades: mantener, revisar, modificar e incorporar. Al final necesitamos salir con un conjunto acotado de propuestas que el Departamento pueda defender y fundamentar.”</blockquote>' +
              '<h3>Ritmo sugerido</h3><ul><li><strong>40 min:</strong> semáforo del reglamento en grupos.</li><li><strong>30–50 min:</strong> matriz de problemas y tensiones.</li><li><strong>20 min:</strong> identificar nudos críticos; cada grupo presenta sus tres más importantes.</li></ul>' +
              '<p>El documento propone una reunión de 90 minutos y deja flexible el tramo de la matriz. Ajusta ese bloque con el tiempo disponible; el momento sobre el modelo académico y los casos son opcionales.</p>' +
              '<h3>Al priorizar, preguntar</h3><ul><li>¿Qué problema concreto puede producir esta disposición?</li><li>¿A quiénes afecta?</li><li>¿Es un problema de redacción, de diseño normativo o de implementación?</li><li>¿Qué principio universitario está comprometido?</li><li>¿Qué podría ocurrir si el artículo se aplica tal como está?</li></ul>' +
              '<h3>Ejes para cruzar la discusión</h3><p>Diversidad disciplinar · Equidad · Proporcionalidad · Reconocimiento de la gestión · Territorio y pertinencia · Desarrollo académico · Conciliación y corresponsabilidad · Transparencia y debido proceso</p>' +
              '<details class="guide-case"><summary>Casos opcionales para activar la conversación</summary><ul>' +
                '<li><strong>Diversidad disciplinar:</strong> comparar una trayectoria aplicada, territorial y comunitaria con otra de publicaciones indexadas. ¿Qué artículo permitiría valorar ambas?</li>' +
                '<li><strong>Gestión:</strong> una jefatura de Departamento durante tres años reduce el tiempo de investigación. ¿Cómo se refleja en evaluación, calificación y promoción?</li>' +
                '<li><strong>Conciliación:</strong> una persona atraviesa un período de responsabilidades de cuidado. ¿Qué mecanismos permiten ajustar su desempeño y cómo se activarían?</li>' +
                '<li><strong>Territorio:</strong> una actividad tiene alto impacto regional, pero no produce de inmediato publicaciones indexadas. ¿Qué regla permitiría reconocer ese aporte?</li>' +
              '</ul></details>' +
            '</div></details>' +
            '<p class="footer-note">El avance muestra cuántos de los seis campos de cada observación están completados. Se actualiza automáticamente cada 10 segundos.</p>' +
          '</aside></div>' +
        '<p class="footer-note">El panel requiere el código de facilitación. Cada enlace de grupo es independiente; renovar un enlace invalida el anterior.</p>';
      bindAdminPanel();
      if (formDraft) {
        const newForm = document.getElementById('create-group-form');
        newForm.elements.name.value = formDraft.name;
        newForm.elements.areas.value = formDraft.areas;
      }
      const guide = app.querySelector('.facilitation-guide');
      if (guide) {
        guide.open = state.guideOpen;
        guide.addEventListener('toggle', function () { state.guideOpen = guide.open; });
      }
      if (focusId) {
        const replacement = document.getElementById(focusId);
        if (replacement) {
          replacement.focus({ preventScroll: true });
          if (selectionStart !== null && typeof replacement.setSelectionRange === 'function') {
            replacement.setSelectionRange(selectionStart, selectionEnd);
          }
        }
      }
      if (state.linkResult) showCreatedLink(state.linkResult.link, state.linkResult.heading, false);
    }

    function renderAdminGroup(entry) {
      const group = entry.summary;
      const isOpen = state.adminOpenGroups.has(group.id);
      const percent = Number(group.completion || 0);
      const observations = entry.observations || [];
      const files = entry.files || [];
      const status = group.status === 'Abierto'
        ? '<span class="status-badge">Abierto</span>'
        : '<span class="status-badge closed">Cerrado</span>';
      const detail = observations.length ? observations.map(function (observation, index) {
        return renderAdminObservation(observation, index + 1, files.filter(function (file) {
          return file.observationId === observation.id;
        }));
      }).join('') : '<div class="empty-state"><strong>Sin observaciones registradas</strong>El grupo aún no ha guardado aportes.</div>';
      const generalFiles = files.filter(function (file) { return !file.observationId; });

      return '<details class="admin-group"' + (isOpen ? ' open' : '') + ' data-group-details="' + escapeAttribute(group.id) + '">' +
        '<summary class="group-row">' +
          '<span class="group-title"><span class="group-index" aria-hidden="true">' + escapeHtml(groupBadge(group.name)) + '</span>' +
          '<span class="group-name"><strong>' + escapeHtml(group.name) + '</strong><small>' + escapeHtml(group.areas || 'Sin ámbito asignado') + '</small></span></span>' +
          '<span class="group-progress"><span class="progress-copy"><span>' + group.observationCount + (group.observationCount === 1 ? ' observación' : ' observaciones') + '</span><strong>' + percent + '% campos completos</strong></span>' +
          '<span class="progress-track" role="progressbar" aria-label="Campos completados por ' + escapeAttribute(group.name) + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + percent + '">' +
          '<span class="progress-fill" style="--progress:' + (percent / 100) + '"></span></span></span>' +
          '<span class="section-count">' + status + '</span>' +
        '</summary><div class="group-detail">' +
          '<div class="detail-topline"><span>Creado ' + escapeHtml(formatDate(group.createdAt)) + '</span><span>Actualizado ' + escapeHtml(formatDate(group.updatedAt)) + '</span></div>' +
          '<div class="panel-actions">' +
            '<button class="text-button" type="button" data-action="rotate" data-id="' + escapeAttribute(group.id) + '">Generar nuevo enlace</button>' +
            '<button class="text-button ' + (group.status === 'Abierto' ? 'danger' : '') + '" type="button" data-action="toggle" data-id="' + escapeAttribute(group.id) + '" data-closed="' + (group.status === 'Abierto') + '">' +
              (group.status === 'Abierto' ? 'Cerrar ficha' : 'Reabrir ficha') + '</button>' +
          '</div>' +
          (generalFiles.length ? '<div class="record-files" aria-label="Archivos generales del grupo">' + fileLinks(generalFiles) + '</div>' : '') +
          '<div class="observation-list">' + detail + '</div>' +
        '</div></details>';
    }

    function renderAdminObservation(observation, index, files) {
      const fields = [
        ['¿Qué plantea?', observation.quePlantea],
        ['Problema/tensión', observation.problemaTension],
        ['Principio en juego', observation.principioJuego],
        ['Propuesta', observation.propuesta]
      ];
      return '<article class="observation-summary"><div class="observation-summary-head">' +
        '<h3>' + index + '. ' + escapeHtml(observation.articulo || 'Aspecto sin artículo específico') + '</h3>' +
        '<span class="semaforo-pill ' + semaforoClass(observation.semaforo) + '">' + escapeHtml(observation.semaforo) + '</span></div>' +
        '<div class="summary-fields">' + fields.map(function (field) {
          return '<div class="summary-field"><strong>' + escapeHtml(field[0]) + '</strong><span>' + escapeHtml(field[1] || '—') + '</span></div>';
        }).join('') + '</div>' +
        (files.length ? '<div class="record-files" aria-label="Archivos de la observación">' + fileLinks(files) + '</div>' : '') +
        '</article>';
    }

    function bindAdminPanel() {
      document.querySelectorAll('[data-group-details]').forEach(function (details) {
        details.addEventListener('toggle', function () {
          if (details.open) state.adminOpenGroups.add(details.dataset.groupDetails);
          else state.adminOpenGroups.delete(details.dataset.groupDetails);
        });
      });

      document.getElementById('create-group-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Creando ficha…';
        try {
          const result = await runServer('createGroup', [state.adminToken, form.elements.name.value, form.elements.areas.value]);
          state.banner = 'Ficha creada. Comparte el enlace solo con las personas de ese grupo.';
          state.bannerError = false;
          await refreshAdmin(true);
          showCreatedLink(result.link);
          announce('La ficha del grupo está lista. Copia y comparte su enlace.');
          document.getElementById('create-group-form').reset();
        } catch (error) {
          state.banner = error.message;
          state.bannerError = true;
          await refreshAdmin(true);
        }
      });

      app.querySelectorAll('[data-action="toggle"]').forEach(function (button) {
        button.addEventListener('click', async function () {
          const closed = button.dataset.closed === 'true';
          button.disabled = true;
          try {
            await runServer('setGroupClosed', [state.adminToken, button.dataset.id, closed]);
            state.banner = closed ? 'La ficha quedó cerrada; sus aportes siguen visibles.' : 'La ficha volvió a quedar abierta.';
            state.bannerError = false;
            await refreshAdmin(true);
          } catch (error) {
            state.banner = error.message;
            state.bannerError = true;
            await refreshAdmin(true);
          }
        });
      });

      app.querySelectorAll('[data-action="rotate"]').forEach(function (button) {
        button.addEventListener('click', async function () {
          if (!window.confirm('Se invalidará el enlace anterior de este grupo. ¿Generar un enlace nuevo?')) return;
          button.disabled = true;
          try {
            const result = await runServer('rotateGroupLink', [state.adminToken, button.dataset.id]);
            showCreatedLink(result.link, 'Enlace renovado');
            state.banner = 'El enlace anterior de ese grupo dejó de funcionar.';
            state.bannerError = false;
            announce(state.banner);
          } catch (error) {
            state.banner = error.message;
            state.bannerError = true;
            await refreshAdmin(true);
          }
        });
      });
    }

    function showCreatedLink(link, heading, remember) {
      if (remember !== false) state.linkResult = { link: link, heading: heading || 'Enlace listo para compartir' };
      const target = document.getElementById('created-link');
      if (!target) return;
      const result = state.linkResult;
      if (!result) { target.innerHTML = ''; return; }
      target.innerHTML = '<div class="link-result" tabindex="-1"><div><strong>' + escapeHtml(result.heading) + '</strong>' +
        '<p>Quien tenga este enlace podrá abrir y editar la ficha de este grupo. Compártelo solo con sus integrantes.</p>' +
        '<a class="link-value" href="' + escapeAttribute(result.link) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(result.link) + '</a></div>' +
        '<div class="panel-actions"><button class="primary-button" type="button" id="copy-group-link">Copiar enlace</button>' +
        '<a class="secondary-button" href="' + escapeAttribute(result.link) + '" target="_blank" rel="noopener noreferrer">Abrir ficha</a>' +
        '<button class="text-button" type="button" id="dismiss-group-link">Ocultar</button></div></div>';
      if (remember !== false) {
        const box = target.querySelector('.link-result');
        box.scrollIntoView({ block: 'center', behavior: 'auto' });
        box.focus({ preventScroll: true });
      }
      document.getElementById('dismiss-group-link').addEventListener('click', function () {
        state.linkResult = null;
        target.innerHTML = '';
      });
      document.getElementById('copy-group-link').addEventListener('click', async function () {
        try {
          await navigator.clipboard.writeText(result.link);
          this.textContent = 'Enlace copiado';
          announce('Enlace copiado.');
        } catch (error) {
          const temporary = document.createElement('textarea');
          temporary.value = result.link;
          temporary.setAttribute('readonly', '');
          temporary.style.position = 'fixed';
          temporary.style.opacity = '0';
          document.body.appendChild(temporary);
          temporary.select();
          const copied = document.execCommand('copy');
          temporary.remove();
          this.textContent = copied ? 'Enlace copiado' : 'Selecciona y copia el enlace';
          announce(copied ? 'Enlace copiado.' : 'No se pudo copiar automáticamente. Selecciona el enlace para copiarlo.');
        }
      });
    }

    async function refreshAdmin(keepBanner) {
      if (!state.adminToken) throw new Error('La sesión de facilitación venció. Ingresa nuevamente el código.');
      if (!keepBanner) {
        state.banner = '';
        state.bannerError = false;
      }
      const snapshot = await runServer('getAdminSnapshot', [state.adminToken]);
      renderAdmin(snapshot);
      scheduleAdminRefresh();
    }

    function scheduleAdminRefresh() {
      window.clearTimeout(state.adminTimer);
      state.adminTimer = window.setTimeout(async function () {
        try {
          await refreshAdmin(true);
        } catch (error) {
          sessionStorage.removeItem(adminStorageKey);
          state.adminToken = '';
          renderAdminLogin(error.message);
        }
      }, 10000);
    }

    function formatDate(value) {
      if (!value) return 'recién creado';
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return 'recién creado';
      return new Intl.DateTimeFormat('es-CL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(parsed);
    }

    function renderGroup(snapshot) {
      document.getElementById('admin-logout').hidden = true;
      state.groupSnapshot = snapshot;
      const group = snapshot.group;
      const isClosed = group.status !== 'Abierto';
      const observations = snapshot.observations || [];
      const files = snapshot.files || [];
      const edit = observations.find(function (item) { return item.id === state.selectedId; });
      const allGroupFiles = files.filter(function (file) { return !file.observationId; });
      const closeBanner = isClosed ? '<div class="group-closed-banner" role="status">La persona facilitadora cerró esta ficha. Puedes consultar los aportes y sus respaldos, pero ya no se pueden editar.</div>' : '';
      const editor = isClosed ? '' : renderObservationEditor(edit);
      const records = observations.length ? observations.map(function (item, index) {
        return renderGroupObservation(item, index + 1, files.filter(function (file) { return file.observationId === item.id; }), isClosed);
      }).join('') : '<div class="empty-state"><strong>Aún no hay observaciones</strong>Registra la primera idea que el grupo quiera dejar por escrito.</div>';

      app.innerHTML = '<div class="group-heading"><div><h1>' + escapeHtml(group.name) + '</h1>' +
        '<p class="lead">' + escapeHtml(group.areas || 'Ficha compartida del grupo') + '</p></div>' +
        '<span class="live-status' + (isClosed ? ' closed' : '') + '"><span class="sync-dot" aria-hidden="true"></span>' +
          (isClosed ? 'Solo lectura' : 'Guardado al registrar · actualización cada 10 s') + '</span></div>' +
        closeBanner +
        '<div class="work-layout"><section class="work-main" aria-labelledby="observations-title">' +
          '<div class="work-section-title"><h2 id="observations-title" tabindex="-1">Observaciones del grupo</h2><span>' + observations.length + (observations.length === 1 ? ' aporte' : ' aportes') + '</span></div>' +
          editor +
          '<div class="records-heading"><h2>Registro de conversación</h2></div>' +
          '<div class="record-list">' + records + '</div>' +
        '</section>' +
        '<aside class="work-side">' +
          '<section class="group-files-section" aria-labelledby="group-files-title"><div class="work-section-title"><h2 id="group-files-title">Respaldos del grupo</h2></div>' +
          '<p class="file-help">Material general de la conversación. Documentos, imágenes y audio · máximo 25 MB por archivo.</p>' +
          '<div class="file-links">' + fileLinks(allGroupFiles) + '</div>' +
          (isClosed ? '' : groupUploadForm(group.id, '')) +
          '</section>' +
          '<section><div class="work-section-title"><h2>La Ficha 8</h2></div>' +
          semaforoKey() +
          '<p class="file-help">Cada observación registra: artículo, semáforo, qué plantea, problema/tensión, principio en juego y propuesta.</p>' +
          '<p class="file-help">Cada grupo registra sus observaciones; las tres prioritarias se acuerdan en la conversación final.</p></section>' +
        '</aside></div>' +
        '<p id="group-message" class="notice" role="status"' + (state.banner ? '' : ' hidden') + '>' + escapeHtml(state.banner) + '</p>' +
        '<p class="footer-note">Los archivos compartidos pueden abrirse por cualquier persona que tenga su enlace. La hoja y la carpeta de Drive pertenecen a la cuenta que publicó la aplicación.</p>';
      bindGroupPage();
    }

    function renderObservationEditor(observation) {
      const isEditing = Boolean(observation);
      const value = function (field) { return escapeAttribute(observation ? observation[field] || '' : ''); };
      return '<form id="observation-form" class="observation-editor">' +
        '<h3>' + (isEditing ? 'Editar observación' : 'Añadir una observación') + '</h3>' +
        '<p class="editor-intro">Completen la ficha entre quienes integran el grupo. Guarda el aporte para compartirlo con la persona facilitadora.</p>' +
        '<input type="hidden" name="id" value="' + value('id') + '">' +
        '<input type="hidden" name="version" value="' + value('version') + '">' +
        '<div class="field"><span class="field-label" id="traffic-label">Semáforo</span>' +
        '<div class="traffic-options" role="radiogroup" aria-labelledby="traffic-label">' +
          SEMAFORO_INFO.map(function (item) { return trafficChoice(item, observation); }).join('') +
        '</div></div>' +
        '<div class="editor-grid">' +
          fieldMarkup('Artículo', 'articulo', 'Ej. Art. 24 o aspecto no regulado', value('articulo'), 'text', false) +
          fieldMarkup('¿Qué plantea?', 'quePlantea', 'Resume la disposición o el vacío que observan.', value('quePlantea'), 'textarea', true) +
          fieldMarkup('Problema/tensión', 'problemaTension', '¿Qué problema concreto o efecto no deseado puede producir?', value('problemaTension'), 'textarea', true) +
          fieldMarkup('Principio en juego', 'principioJuego', 'Ej. equidad, transparencia, pertinencia territorial…', value('principioJuego'), 'textarea', true) +
          fieldMarkup('Propuesta', 'propuesta', '¿Qué cambio concreto debería considerar el Departamento?', value('propuesta'), 'textarea', true) +
        '</div><div class="editor-actions"><span class="draft-note">Puedes guardar un aporte parcial y completarlo más tarde.</span>' +
        '<div class="panel-actions">' + (isEditing ? '<button class="text-button subtle" type="button" id="cancel-edit">Cancelar edición</button>' : '') +
        '<button class="primary-button" type="submit">' + (isEditing ? 'Guardar cambios' : 'Guardar observación') + '</button></div></div>' +
        '<p id="observation-error" class="error-notice" role="alert" hidden></p>' +
      '</form>';
    }

    function fieldMarkup(label, name, placeholder, value, type, fullWidth) {
      const id = 'field-' + name;
      const cls = 'field' + (fullWidth ? ' full-width' : '');
      if (type === 'textarea') {
        return '<div class="' + cls + '"><label for="' + id + '">' + escapeHtml(label) + '</label>' +
          '<textarea id="' + id + '" name="' + name + '" maxlength="' + (name === 'principioJuego' ? '3000' : '5000') + '" placeholder="' + escapeAttribute(placeholder) + '">' + escapeHtml(value) + '</textarea></div>';
      }
      return '<div class="' + cls + '"><label for="' + id + '">' + escapeHtml(label) + '</label>' +
        '<input id="' + id + '" name="' + name + '" type="text" maxlength="240" value="' + value + '" placeholder="' + escapeAttribute(placeholder) + '"></div>';
    }

    function trafficChoice(item, observation) {
      const checked = observation && observation.semaforo === item.name;
      return '<span class="traffic-choice ' + item.cls + '"><input type="radio" id="traffic-' + item.cls + '" name="semaforo" value="' + item.name + '"' +
        (checked ? ' checked' : '') + '><label for="traffic-' + item.cls + '">' + item.name + '<span class="traffic-desc">' + item.desc + '</span></label></span>';
    }

    function renderGroupObservation(observation, index, files, isClosed) {
      const fields = [
        ['¿Qué plantea?', observation.quePlantea],
        ['Problema/tensión', observation.problemaTension],
        ['Principio en juego', observation.principioJuego],
        ['Propuesta', observation.propuesta]
      ];
      return '<article class="record"><div class="record-head"><div><span class="record-number">Observación ' + index + '</span>' +
        '<h3>' + escapeHtml(observation.articulo || 'Aspecto sin artículo específico') + '</h3></div>' +
        '<span class="semaforo-pill ' + semaforoClass(observation.semaforo) + '">' + escapeHtml(observation.semaforo) + '</span></div>' +
        '<div class="record-fields">' + fields.map(function (field) {
          return '<div class="record-field"><strong>' + escapeHtml(field[0]) + '</strong><p>' + escapeHtml(field[1] || '—') + '</p></div>';
        }).join('') + '</div>' +
        '<div class="record-files">' + fileLinks(files) + '</div>' +
        (isClosed ? '' : '<div class="record-actions"><button class="text-button" type="button" data-action="edit-observation" data-id="' + escapeAttribute(observation.id) + '">Editar</button>' +
          groupUploadForm(state.groupId, observation.id) + '</div>') +
        '</article>';
    }

    function groupUploadForm(groupId, observationId) {
      const id = 'upload-' + (observationId || 'group');
      return '<form class="group-link-form" data-upload-form>' +
        '<input type="hidden" name="groupId" value="' + escapeAttribute(groupId) + '">' +
        '<input type="hidden" name="key" value="' + escapeAttribute(state.groupKey) + '">' +
        '<input type="hidden" name="observationId" value="' + escapeAttribute(observationId) + '">' +
        '<label class="file-upload" for="' + escapeAttribute(id) + '">＋ Adjuntar archivo' +
        '<input id="' + escapeAttribute(id) + '" name="file" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.odp,.txt,.rtf,.csv,.jpg,.jpeg,.png,.gif,.webp,.heic,.bmp,.tif,.tiff,.mp3,.m4a,.wav,.ogg,.oga,.aac,.flac,.amr,audio/*,image/*" aria-label="Seleccionar archivo de respaldo" data-file-input></label>' +
        '<span class="field-hint" data-upload-status></span></form>';
    }

    function bindGroupPage() {
      const form = document.getElementById('observation-form');
      if (form) {
        form.addEventListener('input', function () { state.dirty = true; });
        form.addEventListener('change', function () { state.dirty = true; });
        form.addEventListener('submit', saveObservation);
      }
      const cancel = document.getElementById('cancel-edit');
      if (cancel) cancel.addEventListener('click', cancelEdit);

      app.querySelectorAll('[data-action="edit-observation"]').forEach(function (button) {
        button.addEventListener('click', function () {
          if (state.dirty && !window.confirm('Hay cambios sin guardar. ¿Descartarlos y editar este aporte?')) return;
          state.dirty = false;
          state.selectedId = button.dataset.id;
          state.banner = '';
          renderGroup(state.groupSnapshot);
          document.getElementById('observation-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
          document.getElementById('traffic-keep').focus({ preventScroll: true });
        });
      });

      app.querySelectorAll('[data-upload-form]').forEach(function (uploadForm) {
        const input = uploadForm.querySelector('[data-file-input]');
        input.addEventListener('change', function () {
          if (input.files && input.files[0]) uploadGroupFile(uploadForm, input.files[0]);
        });
      });
    }

    async function saveObservation(event) {
      event.preventDefault();
      if (state.saving) return;
      const form = event.currentTarget;
      const errorNode = document.getElementById('observation-error');
      const button = form.querySelector('button[type="submit"]');
      const values = Object.fromEntries(new FormData(form).entries());
      const observation = {
        id: values.id,
        articulo: values.articulo,
        semaforo: values.semaforo,
        quePlantea: values.quePlantea,
        problemaTension: values.problemaTension,
        principioJuego: values.principioJuego,
        propuesta: values.propuesta
      };
      errorNode.hidden = true;
      state.saving = true;
      button.disabled = true;
      button.textContent = 'Guardando…';
      try {
        const result = await runServer('saveObservation', [
          state.groupId, state.groupKey, observation, values.version
        ]);
        if (result.conflict) {
          state.dirty = false;
          state.selectedId = '';
          state.banner = 'Otra persona del grupo guardó este aporte mientras lo editabas. La versión más reciente ya está cargada; vuelve a revisar antes de editar.';
          await refreshGroup(true);
          document.getElementById('observations-title').focus({ preventScroll: true });
          return;
        }
        state.dirty = false;
        state.selectedId = '';
        state.banner = 'Observación guardada.';
        await refreshGroup(true);
        document.getElementById('observations-title').focus({ preventScroll: true });
        announce(state.banner);
      } catch (error) {
        errorNode.textContent = error.message;
        errorNode.hidden = false;
        button.disabled = false;
        button.textContent = observation.id ? 'Guardar cambios' : 'Guardar observación';
      } finally {
        state.saving = false;
      }
    }

    function cancelEdit() {
      if (state.dirty && !window.confirm('Hay cambios sin guardar. ¿Descartarlos?')) return;
      state.dirty = false;
      state.selectedId = '';
      state.banner = '';
      renderGroup(state.groupSnapshot);
    }

    function uploadGroupFile(form, file) {
      const status = form.querySelector('[data-upload-status]');
      const input = form.querySelector('[data-file-input]');
      const label = form.querySelector('.file-upload');
      if (file.size > 25 * 1024 * 1024) {
        status.textContent = 'El archivo supera el límite de 25 MB.';
        return;
      }
      if (state.groupSnapshot.group.status !== 'Abierto') {
        status.textContent = 'La ficha está cerrada.';
        return;
      }
      status.textContent = 'Preparando ' + file.name + '…';
      label.setAttribute('aria-disabled', 'true');
      const payload = {
        groupId: form.elements.groupId.value,
        key: form.elements.key.value,
        observationId: form.elements.observationId.value,
        name: file.name,
        mimeType: file.type || '',
        data: ''
      };
      input.disabled = true;
      const reader = new FileReader();
      reader.onerror = function () {
        status.textContent = 'No se pudo leer el archivo en este dispositivo.';
        label.removeAttribute('aria-disabled');
        input.disabled = false;
        input.value = '';
      };
      reader.onload = function () {
        const result = String(reader.result || '');
        payload.data = result.slice(result.indexOf(',') + 1);
        status.textContent = 'Subiendo ' + file.name + '…';
        sendUpload(payload, status, input, label);
      };
      reader.readAsDataURL(file);
    }

    function sendUpload(payload, status, input, label) {
      google.script.run
        .withSuccessHandler(function () {
          label.removeAttribute('aria-disabled');
          input.disabled = false;
          input.value = '';
          announce('Archivo subido a Drive.');
          if (state.dirty) {
            status.textContent = 'Archivo subido. Guarda o cancela la edición para actualizar la ficha.';
            return;
          }
          state.banner = 'Archivo subido a Drive.';
          refreshGroup(true).catch(function () {
            status.textContent = 'Archivo subido, pero no se pudo actualizar la vista. Recarga la ficha para ver el respaldo.';
          });
        })
        .withFailureHandler(function (error) {
          status.textContent = error && error.message ? error.message : 'No se pudo subir el archivo.';
          label.removeAttribute('aria-disabled');
          input.disabled = false;
          input.value = '';
        })
        .uploadAttachment(payload);
    }

    async function refreshGroup(keepBanner) {
      if (!state.groupId || !state.groupKey) {
        renderError('Enlace incompleto', 'Este enlace no incluye la clave de acceso al grupo. Solicita nuevamente el enlace a la persona facilitadora.');
        return;
      }
      if (!keepBanner) state.banner = '';
      const snapshot = await runServer('getGroupSnapshot', [state.groupId, state.groupKey]);
      state.groupSnapshot = snapshot;
      const activeElement = document.activeElement;
      const editingControlFocused = activeElement && app.contains(activeElement) &&
        (Boolean(activeElement.closest('#observation-form')) || activeElement.matches('[data-file-input]'));
      if (state.dirty || editingControlFocused) {
        scheduleGroupRefresh();
        return;
      }
      renderGroup(snapshot);
      scheduleGroupRefresh();
    }

    function scheduleGroupRefresh() {
      window.clearTimeout(state.groupTimer);
      state.groupTimer = window.setTimeout(async function () {
        try {
          await refreshGroup(true);
        } catch (error) {
          renderError('No se pudo actualizar esta ficha', error.message, '<button class="secondary-button" type="button" id="retry-group">Volver a intentar</button>');
          bindGroupRetry();
        }
      }, state.dirty ? 15000 : 10000);
    }

    function stopTimers() {
      window.clearTimeout(state.adminTimer);
      window.clearTimeout(state.groupTimer);
    }

    async function start() {
      document.getElementById('admin-logout').addEventListener('click', function () {
        sessionStorage.removeItem(adminStorageKey);
        state.adminToken = '';
        state.linkResult = null;
        renderHome('Sesión cerrada.');
      });
      if (state.groupId) {
        renderLoading('Abriendo la ficha de grupo…');
        try {
          await refreshGroup(true);
        } catch (error) {
          renderError('No se pudo abrir la ficha', error.message, '<button class="secondary-button" type="button" id="retry-group">Volver a intentar</button>');
          bindGroupRetry();
        }
        return;
      }
      state.adminToken = sessionStorage.getItem(adminStorageKey) || '';
      if (state.adminToken) {
        renderLoading('Comprobando el acceso de facilitación…');
        try {
          await refreshAdmin(true);
        } catch (error) {
          sessionStorage.removeItem(adminStorageKey);
          state.adminToken = '';
          renderAdminLogin(error.message);
        }
      } else {
        renderHome('');
      }
    }

    start();
  }());
</script>
